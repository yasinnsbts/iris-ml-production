[project]
name = "iris-ml-production"
version = "0.1.0"
description = "Iris classification ML project refactored to production-like standards"
authors = [
    {name = "Yaroslav"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "scikit-learn (>=1.9.1,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)"
]

[tool.poetry]
packages = [
    {include = "iris_classifier"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
